version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: smartscheduler-db
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: smartscheduler_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - scheduler-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartscheduler-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/smartscheduler_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=mysql
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - scheduler-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartscheduler-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - scheduler-net

volumes:
  db_data:

networks:
  scheduler-net:
    driver: bridge
