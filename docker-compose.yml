version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smartscheduler-db
    restart: always
    environment:
      MYSQL_DATABASE: smartscheduler_db
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: smartscheduler-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=smartscheduler_db
      - DB_USER=root
      - DB_PASSWORD=mysql
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: smartscheduler-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
