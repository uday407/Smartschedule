version: "1"
services:
  # Spring Boot Backend Service (Docker Web Service)
  - type: web
    name: smartscheduler-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: JAVA_OPTS
        value: "-Xmx384m -Xms256m"
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:h2:mem:smartscheduler_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
      - key: SPRING_MAIL_USERNAME
        value: "n.udaykumar2005@gmail.com"
      - key: SPRING_MAIL_PASSWORD
        value: "ninpgitexztnqthl"


  # React Vite Frontend (Static Web Site)
  - type: web
    name: smartscheduler-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://smartscheduler-backend-us41.onrender.com"
